# ByteTrack settings tuned conservatively for the volleyball-player detector.
# Ultralytics tracker configuration.
tracker_type: bytetrack

# Association thresholds.
track_high_thresh: 0.25
track_low_thresh: 0.10
new_track_thresh: 0.25

# Keep a lost track alive long enough to survive short player occlusions near the net.
track_buffer: 45

# Matching threshold for associating detections with existing tracks.
match_thresh: 0.80

# Fuse detector confidence with spatial matching.
fuse_score: True
